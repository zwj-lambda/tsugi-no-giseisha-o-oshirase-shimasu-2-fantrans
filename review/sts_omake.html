<!doctype html>

<style>
body { font-family: system-ui, sans-serif; margin: 16px; }
table { border-collapse: collapse; width: 100%; }

<h2>sts_omake.tob</h2>
<p><label>状态 <select id="f" onchange="flt()">

<option>机审</option><option>人工定稿</option><option>skip</option>
</select></label> <span id="stat"></span></p>
<table><tr><th>seq</th><th>状态</th><th>role</th>
<th>原文</th><th>译文</th><th>备注</th></tr>
<tr class="未翻"><td>1</td><td style="color:#888888">未翻</td><td>system</td><td class="jp">../tob/rom2/sts_omake.tob</td><td class="zh"></td><td class="note"></td></tr>
<tr class="未翻"><td>2</td><td style="color:#888888">未翻</td><td>system</td><td class="jp">sts_omake.sts</td><td class="zh"></td><td class="note"></td></tr>
<tr class="未翻"><td>3</td><td style="color:#888888">未翻</td><td>system</td><td class="jp">sts_omake_start</td><td class="zh"></td><td class="note"></td></tr>

<tr class="未翻"><td>5</td><td style="color:#888888">未翻</td><td>narrative</td><td class="jp">未作成</td><td class="zh"></td><td class="note"></td></tr>
<tr class="未翻"><td>6</td><td style="color:#888888">未翻</td><td>narrative</td><td class="jp">kﾏだシーンリプレイﾉ分岐ﾊ未作成</td><td class="zh"></td><td class="note"></td></tr>
</table>
<script>
function flt() {
  const v = document.getElementById('f').value;
  let n = 0;
  for (const tr of document.querySelectorAll('tr')) {
    if (!tr.rowIndex || !tr.className) continue;
    const show = !v || tr.className === v;
    tr.style.display = show ? '' : 'none';
    if (show) n++;
  }
  document.getElementById('stat').textContent = n + ' 行';
}
flt();
</script>
